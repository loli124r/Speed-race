<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODE DOMINION - Ultimate Neon Racer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 650px;
            height: 700px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.25);
            border: 2px solid rgba(0, 255, 204, 0.4);
            border-radius: 20px;
            background: #071124;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            border-radius: 18px;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 17, 36, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        h1 {
            margin: 0 0 5px 0;
            color: #00ffcc;
            font-size: 32px;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
        }

        p {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: #94a3b8;
        }

        .input-group {
            margin-bottom: 12px;
            width: 100%;
            max-width: 280px;
            text-align: right;
        }

        label {
            font-size: 12px;
            color: #cbd5e1;
            display: block;
            margin-bottom: 4px;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            text-align: center;
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        select option {
            background: #071124;
            color: #fff;
        }

        .car-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .car-option {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .car-option.selected {
            border-color: #00ffcc;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        button {
            background: linear-gradient(135deg, #00ffcc 0%, #00bfff 100%);
            color: #020c1b;
            border: none;
            padding: 12px 30px;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 12px;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.4);
            font-family: 'Cairo', sans-serif;
            margin-top: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 255, 204, 0.6);
        }

        .leaderboard {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            width: 85%;
            max-width: 300px;
            max-height: 120px;
            overflow-y: auto;
            text-align: right;
        }

        .leaderboard h3 {
            margin: 0 0 5px 0;
            color: #ffcc00;
            font-size: 14px;
            text-align: center;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- شاشة البداية والمرآب -->
    <div id="start-screen" class="screen">
        <h1>ULTIMATE RACER</h1>
        <p>نيترو خارق، بيئات متغيرة، وعقبات ذكية بانتظارك!</p>
        
        <div class="input-group">
            <label>اسم اللاعب الأول:</label>
            <input type="text" id="p1-name" value="اللاعب 1" maxlength="10">
        </div>

        <div class="input-group">
            <label>اختر مظهر السيارة (P1):</label>
            <div class="car-selector" id="p1-color-selector">
                <div class="car-option selected" style="background:#00ffcc;" data-color="#00ffcc"></div>
                <div class="car-option" style="background:#ff0055;" data-color="#ff0055"></div>
                <div class="car-option" style="background:#ffcc00;" data-color="#ffcc00"></div>
                <div class="car-option" style="background:#9933ff;" data-color="#9933ff"></div>
            </div>
        </div>

        <div class="input-group">
            <label>وضع اللعب:</label>
            <select id="game-mode" onchange="togglePlayer2Input()">
                <option value="1">لاعب فردي (أسهم المفاتيح + Space للنيترو)</option>
                <option value="2">لاعبان محلياً (P1: A/D - P2: يسار/يمين)</option>
            </select>
        </div>

        <div id="p2-input-container" class="input-group hidden">
            <label>اسم اللاعب الثاني:</label>
            <input type="text" id="p2-name" value="اللاعب 2" maxlength="10">
        </div>

        <button id="start-btn">انطلاق السباق</button>
    </div>

    <!-- شاشة النهاية والإحصائيات -->
    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: #ff3366;">نهاية الجولة</h1>
        <p id="final-stats" style="font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 10px;"></p>
        
        <div class="leaderboard">
            <h3>أفضل لوحة نتائج</h3>
            <div id="high-scores-list"></div>
        </div>

        <button id="restart-btn">سباق جديد</button>
    </div>

    <!-- لوحة الرسم -->
    <canvas id="gameCanvas" width="650" height="700"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const finalStats = document.getElementById('final-stats');
const highScoreList = document.getElementById('high-scores-list');
const p1NameInput = document.getElementById('p1-name');
const p2NameInput = document.getElementById('p2-name');
const gameModeSelect = document.getElementById('game-mode');
const p2InputContainer = document.getElementById('p2-input-container');

// اختيار اللون في المرآب
let selectedP1Color = '#00ffcc';
document.querySelectorAll('#p1-color-selector .car-option').forEach(opt => {
    opt.addEventListener('click', (e) => {
        document.querySelectorAll('#p1-color-selector .car-option').forEach(o => o.classList.remove('selected'));
        e.target.classList.add('selected');
        selectedP1Color = e.target.getAttribute('data-color');
    });
});

// مولد أصوات متقدم (Synthwave Music & SFX)
let audioCtx = null;
let bgmInterval = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startBGM();
    }
}

function startBGM() {
    if (bgmInterval) clearInterval(bgmInterval);
    const notes = [130.81, 164.81, 196.00, 220.00, 164.81, 146.83];
    let step = 0;
    bgmInterval = setInterval(() => {
        if (!isPlaying || !audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
            step++;
        } catch(e){}
    }, 300);
}

function playSound(type) {
    if (!audioCtx) return;
    try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'powerup') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'nitro') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }
    } catch(e){}
}

let isTwoPlayer = false;
let players = [];
let obstacles = [];
let powerUps = [];
let particles = [];
let raindrops = [];
let distance = 0;
let gameSpeed = 5;
const maxSpeed = 14;
let roadLineOffset = 0;
let isPlaying = false;
let spawnTimer = 0;
let powerUpTimer = 0;
let sessionTime = 0;
let maxSpeedReached = 5;
let powerUpsCollected = 0;

let lanesP1 = [100, 200, 300];
let lanesP2 = [420, 520, 620];

function togglePlayer2Input() {
    isTwoPlayer = gameModeSelect.value === "2";
    if (isTwoPlayer) {
        p2InputContainer.classList.remove('hidden');
        canvas.width = 720;
        lanesP1 = [90, 180, 270];
        lanesP2 = [450, 540, 630];
    } else {
        p2InputContainer.classList.add('hidden');
        canvas.width = 450;
        lanesP1 = [90, 225, 360];
    }
}

const keys = {};
window.addEventListener('keydown', (e) => { keys[e.key] = true; });
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

startBtn.addEventListener('click', () => { initAudio(); startGame(); });
restartBtn.addEventListener('click', () => { startGame(); });

function startGame() {
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    
    obstacles = [];
    powerUps = [];
    particles = [];
    raindrops = [];
    distance = 0;
    gameSpeed = 5;
    spawnTimer = 0;
    powerUpTimer = 0;
    sessionTime = 0;
    maxSpeedReached = 5;
    powerUpsCollected = 0;
    isPlaying = true;

    // توليد قطرات المطر للخلفية
    for(let i=0; i<40; i++) {
        raindrops.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, len: Math.random()*15+10, speed: Math.random()*8+6 });
    }

    if (isTwoPlayer) {
        players = [
            { name: p1NameInput.value || 'اللاعب 1', lanes: lanesP1, laneIdx: 1, x: lanesP1[1], y: 580, w: 38, h: 72, color: selectedP1Color, shield: false, slowMo: false, nitro: 100, isNitroActive: false, scoreMult: 1, active: true },
            { name: p2NameInput.value || 'اللاعب 2', lanes: lanesP2, laneIdx: 1, x: lanesP2[1], y: 580, w: 38, h: 72, color: '#ff007f', shield: false, slowMo: false, nitro: 100, isNitroActive: false, scoreMult: 1, active: true }
        ];
    } else {
        players = [
            { name: p1NameInput.value || 'اللاعب 1', lanes: lanesP1, laneIdx: 1, x: lanesP1[1], y: 580, w: 42, h: 76, color: selectedP1Color, shield: false, slowMo: false, nitro: 100, isNitroActive: false, scoreMult: 1, active: true }
        ];
    }

    requestAnimationFrame(updateGame);
}

function handleControls() {
    players.forEach((p, idx) => {
        if (!p.active) return;
        if (idx === 0) {
            let leftKey = isTwoPlayer ? 'a' : 'ArrowLeft';
            let rightKey = isTwoPlayer ? 'd' : 'ArrowRight';
            let aCaps = isTwoPlayer ? 'A' : '';
            let dCaps = isTwoPlayer ? 'D' : '';

            if ((keys[leftKey] || keys[aCaps]) && !p.movedLeft) {
                if (p.laneIdx > 0) p.laneIdx--;
                p.movedLeft = true;
            }
            if (!keys[leftKey] && !keys[aCaps]) p.movedLeft = false;

            if ((keys[rightKey] || keys[dCaps]) && !p.movedRight) {
                if (p.laneIdx < p.lanes.length - 1) p.laneIdx++;
                p.movedRight = true;
            }
            if (!keys[rightKey] && !keys[dCaps]) p.movedRight = false;

            // تفعيل النيترو عبر زر Space
            if (keys[' '] && p.nitro > 10 && !p.isNitroActive) {
                p.isNitroActive = true;
                playSound('nitro');
            }
        } else if (idx === 1) {
            if (keys['ArrowLeft'] && !p.movedLeft) {
                if (p.laneIdx > 0) p.laneIdx--;
                p.movedLeft = true;
            }
            if (!keys['ArrowLeft']) p.movedLeft = false;

            if (keys['ArrowRight'] && !p.movedRight) {
                if (p.laneIdx < p.lanes.length - 1) p.laneIdx++;
                p.movedRight = true;
            }
            if (!keys['ArrowRight']) p.movedRight = false;
        }

        // إدارة استهلاك وشحن طاقة النيترو
        if (p.isNitroActive) {
            p.nitro -= 1.5;
            if (p.nitro <= 0) p.isNitroActive = false;
        } else if (p.nitro < 100) {
            p.nitro += 0.15;
        }
        if (!keys[' '] && idx === 0) p.isNitroActive = false;
    });
}

function spawnObstacle() {
    let targetLanes = isTwoPlayer ? [0,1,2, 3,4,5] : [0,1,2];
    let chosenLane = targetLanes[Math.floor(Math.random() * targetLanes.length)];
    let xMap = isTwoPlayer ? [...lanesP1, ...lanesP2] : lanesP1;
    
    obstacles.push({
        x: xMap[chosenLane],
        y: -100,
        w: 38,
        h: 70,
        color: ['#ff3333', '#ff9900', '#9933ff', '#3366ff'][Math.floor(Math.random() * 4)],
        dynamic: Math.random() > 0.6, // بعض السيارات تغير مسارها بذكاء
        dir: Math.random() > 0.5 ? 1 : -1,
        laneCenter: xMap[chosenLane]
    });
}

function spawnPowerUp() {
    let targetLanes = isTwoPlayer ? [0,1,2, 3,4,5] : [0,1,2];
    let chosenLane = targetLanes[Math.floor(Math.random() * targetLanes.length)];
    let xMap = isTwoPlayer ? [...lanesP1, ...lanesP2] : lanesP1;
    let types = ['shield', 'slow', 'double'];
    let type = types[Math.floor(Math.random() * types.length)];

    powerUps.push({ x: xMap[chosenLane], y: -100, w: 32, h: 32, type: type });
}

function updateGame() {
    if (!isPlaying) return;

    sessionTime += 0.016;
    handleControls();

    let isAnyNitro = players.some(p => p.isNitroActive);
    let activeSlowMo = players.some(p => p.slowMo);
    
    let speedMult = isAnyNitro ? 2.2 : (activeSlowMo ? 0.45 : 1);
    let currentSpeedFactor = gameSpeed * speedMult;

    if (currentSpeedFactor > maxSpeedReached) maxSpeedReached = currentSpeedFactor;

    distance += currentSpeedFactor * 0.1;
    if (gameSpeed < maxSpeed && !isAnyNitro) gameSpeed += 0.001;

    roadLineOffset += currentSpeedFactor;
    if (roadLineOffset > 50) roadLineOffset = 0;

    players.forEach(p => {
        let targetX = p.lanes[p.laneIdx];
        p.x += (targetX - p.x) * 0.28;

        // إحداث غبار خلف العجلات عند السرعة العالية أو النيترو
        if (p.isNitroActive || currentSpeedFactor > 8) {
            particles.push({ x: p.x + (Math.random()*20-10), y: p.y + 35, color: p.isNitroActive ? '#00ffff' : 'rgba(255,255,255,0.4)', size: Math.random()*4+2, alpha: 1 });
        }
    });

    spawnTimer++;
    if (spawnTimer > Math.max(20, 70 - Math.floor(gameSpeed * 3.5))) {
        spawnObstacle();
        spawnTimer = 0;
    }

    powerUpTimer++;
    if (powerUpTimer > 260) {
        spawnPowerUp();
        powerUpTimer = 0;
    }

    // تحديث العقبات (مع دعم السيارات المتحركة بذكاء بين المسارات)
    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].y += currentSpeedFactor;

        if (obstacles[i].dynamic) {
            obstacles[i].x += obstacles[i].dir * 0.8;
            // حصر الحركة ضمن إطار المسار
            if (Math.abs(obstacles[i].x - obstacles[i].laneCenter) > 35) obstacles[i].dir *= -1;
        }

        players.forEach(p => {
            if (!p.active) return;
            if (
                p.x - p.w/2 < obstacles[i].x + obstacles[i].w/2 &&
                p.x + p.w/2 > obstacles[i].x - obstacles[i].w/2 &&
                p.y - p.h/2 < obstacles[i].y + obstacles[i].h/2 &&
                p.y + p.h/2 > obstacles[i].y - obstacles[i].h/2
            ) {
                if (p.isNitroActive) {
                    // حصانة تامة أثناء تفعيل النيترو وتحطيم السيارة المعارضة
                    particles.push({ x: obstacles[i].x, y: obstacles[i].y, color: '#ffcc00', size: 8, alpha: 1, spark: true });
                    obstacles.splice(i, 1);
                    playSound('powerup');
                } else if (p.shield) {
                    p.shield = false;
                    playSound('powerup');
                    obstacles.splice(i, 1);
                } else {
                    p.active = false;
                    playSound('crash');
                }
            }
        });

        if (obstacles[i] && obstacles[i].y > canvas.height + 80) {
            obstacles.splice(i, 1);
        }
    }

    // تحديث الصناديق والمساعدات
    for (let i = powerUps.length - 1; i >= 0; i--) {
        powerUps[i].y += currentSpeedFactor;

        players.forEach(p => {
            if (!p.active) return;
            if (
                p.x - p.w/2 < powerUps[i].x + powerUps[i].w/2 &&
                p.x + p.w/2 > powerUps[i].x - powerUps[i].w/2 &&
                p.y - p.h/2 < powerUps[i].y + powerUps[i].h/2 &&
                p.y + p.h/2 > powerUps[i].y - powerUps[i].h/2
            ) {
                playSound('powerup');
                powerUpsCollected++;
                applyPowerUp(p, powerUps[i].type);
                powerUps.splice(i, 1);
            }
        });

        if (powerUps[i] && powerUps[i].y > canvas.height + 50) {
            powerUps.splice(i, 1);
        }
    }

    if (players.every(p => !p.active)) {
        endGame();
        return;
    }

    // تحديد لون خلفية البيئة بناءً على المسافة (نهار -> غروب -> نيل نيون)
    let envTheme = '#071124';
    let skyGlow = 'rgba(0, 255, 204, 0.05)';
    if (distance > 500 && distance < 1200) {
        envTheme = '#1a0a2a'; // غروب بنفسجي
        skyGlow = 'rgba(255, 51, 153, 0.08)';
    } else if (distance >= 1200) {
        envTheme = '#02050c'; // ليل عميق مع مطر ونيون
        skyGlow = 'rgba(0, 191, 255, 0.1)';
    }

    // ---------------- رسم العناصر ----------------
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = envTheme;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // تأثير ضوء سماء البيئة
    ctx.fillStyle = skyGlow;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // رسم المطر إذا تجاوزنا المسافة المطلوبة
    if (distance >= 1200) {
        ctx.strokeStyle = 'rgba(100, 200, 255, 0.4)';
        ctx.lineWidth = 1.5;
        raindrops.forEach(drop => {
            drop.y += drop.speed * (isAnyNitro ? 2 : 1);
            if (drop.y > canvas.height) drop.y = -20;
            ctx.beginPath();
            ctx.moveTo(drop.x, drop.y);
            ctx.lineTo(drop.x - 1, drop.y + drop.len);
            ctx.stroke();
        });
    }

    drawRoadLines(lanesP1);
    if (isTwoPlayer) {
        ctx.fillStyle = '#00ffcc';
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 10;
        ctx.fillRect(380, 0, 4, canvas.height);
        ctx.shadowBlur = 0;
        drawRoadLines(lanesP2);
    }

    // رسم الجسيمات والشرارات والغبار
    particles.forEach((pt, idx) => {
        pt.y += currentSpeedFactor * 0.5;
        pt.alpha -= 0.03;
        if (pt.alpha <= 0) { particles.splice(idx, 1); return; }
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.alpha;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    // رسم الصناديق
    powerUps.forEach(pu => {
        ctx.save();
        ctx.translate(pu.x, pu.y);
        let glowColor = pu.type === 'shield' ? '#00ccff' : (pu.type === 'slow' ? '#ffcc00' : '#ff00ff');
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 12;
        ctx.fillStyle = glowColor;
        ctx.beginPath();
        ctx.roundRect(-pu.w/2, -pu.h/2, pu.w, pu.h, 8);
        ctx.fill();
        ctx.fillStyle = '#020c1b';
        ctx.font = 'bold 14px Cairo';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pu.type === 'shield' ? '🛡️' : (pu.type === 'slow' ? '⏳' : '⭐'), 0, 0);
        ctx.restore();
    });

    // رسم السيارات المعاكسة
    obstacles.forEach(obs => {
        drawCar(obs.x, obs.y, obs.w, obs.h, obs.color, false);
    });

    // رسم اللاعبين والدروع
    players.forEach(p => {
        if (p.active) {
            drawCar(p.x, p.y, p.w, p.h, p.color, true, p.isNitroActive);
            if (p.shield) {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 32, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }
    });

    // واجهة النقاط وشريط النيترو
    ctx.fillStyle = '#fff';
    ctx.font = '700 13px Cairo';
    ctx.textAlign = 'right';
    players.forEach((p, idx) => {
        let label = isTwoPlayer ? `${p.name}: ${Math.floor(distance * p.scoreMult)} م` : `المسافة: ${Math.floor(distance)} م`;
        ctx.fillText(label, canvas.width - 15, 25 + (idx * 50));
        
        // رسم شريط النيترو
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(canvas.width - 130, 32 + (idx * 50), 115, 8);
        ctx.fillStyle = p.isNitroActive ? '#00ffff' : '#ff007f';
        ctx.fillRect(canvas.width - 130, 32 + (idx * 50), (p.nitro / 100) * 115, 8);
        ctx.fillStyle = '#fff';
        ctx.font = '10px Cairo';
        ctx.fillText('⚡ NITRO', canvas.width - 135, 39 + (idx * 50));
    });

    requestAnimationFrame(updateGame);
}

function drawRoadLines(lanesArray) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 3;
    ctx.setLineDash([20, 20]);
    ctx.lineDashOffset = -roadLineOffset;

    let dividers = [];
    if (lanesArray.length === 3) {
        dividers = [(lanesArray[0] + lanesArray[1])/2, (lanesArray[1] + lanesArray[2])/2];
    }
    dividers.forEach(dx => {
        ctx.beginPath();
        ctx.moveTo(dx, 0);
        ctx.lineTo(dx, canvas.height);
        ctx.stroke();
    });
    ctx.setLineDash([]);
}

function drawCar(x, y, w, h, color, isPlayer, nitroActive) {
    ctx.save();
    ctx.translate(x, y);

    if (isPlayer) {
        ctx.shadowColor = nitroActive ? '#00ffff' : color;
        ctx.shadowBlur = nitroActive ? 25 : 12;
    }

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-w/2, -h/2, w, h, 10);
    ctx.fill();

    // الزجاج
    ctx.fillStyle = '#020c1b';
    ctx.fillRect(-w/3, -h/4, w*0.66, h*0.28);

    // العجلات
    ctx.fillStyle = '#000';
    ctx.fillRect(-w/2 - 3, -h/3, 5, 15);
    ctx.fillRect(w/2 - 2, -h/3, 5, 15);
    ctx.fillRect(-w/2 - 3, h/4, 5, 15);
    ctx.fillRect(w/2 - 2, h/4, 5, 15);

    // لهب النيترو من الخلف
    if (nitroActive) {
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.moveTo(-w/3, h/2);
        ctx.lineTo(0, h/2 + 25);
        ctx.lineTo(w/3, h/2);
        ctx.fill();
    }

    ctx.restore();
}

function applyPowerUp(player, type) {
    if (type === 'shield') {
        player.shield = true;
    } else if (type === 'slow') {
        player.slowMo = true;
        setTimeout(() => { player.slowMo = false; }, 3000);
    } else if (type === 'double') {
        player.scoreMult = 2;
        setTimeout(() => { player.scoreMult = 1; }, 3000);
    }
}

function saveHighScore(name, score) {
    let highScores = JSON.parse(localStorage.getItem('ultimateCarHighScores') || '[]');
    highScores.push({ name, score });
    highScores.sort((a, b) => b.score - a.score);
    highScores = highScores.slice(0, 5);
    localStorage.setItem('ultimateCarHighScores', JSON.stringify(highScores));
}

function displayHighScores() {
    let highScores = JSON.parse(localStorage.getItem('ultimateCarHighScores') || '[]');
    if (highScores.length === 0) {
        highScoreList.innerHTML = '<div style="text-align:center; color:#64748b;">لا توجد نتائج مسجلة</div>';
        return;
    }
    highScoreList.innerHTML = highScores.map((item, index) => 
        `<div class="score-row"><span>${index + 1}. ${item.name}</span><strong>${item.score} م</strong></div>`
    ).join('');
}

function endGame() {
    isPlaying = false;
    let statsText = "";
    players.forEach(p => {
        let pScore = Math.floor(distance * p.scoreMult);
        saveHighScore(p.name, pScore);
        statsText += `${p.name}: ${pScore} متر<br><span style="font-size:11px; color:#94a3b8;">الصناديق: ${powerUpsCollected} | الزمن: ${Math.floor(sessionTime)}ث</span><br>`;
    });

    finalStats.innerHTML = statsText;
    displayHighScores();
    gameOverScreen.classList.remove('hidden');
}
</script>
